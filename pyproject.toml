[project]
name = "sprawdzarka"
version = "0.1.0"
description = "CLI that checks whether AI agent code satisfies a written task."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "openai>=1.99.0",
    "pydantic>=2.7.0",
]

[project.scripts]
sprawdzarka = "sprawdzarka.cli:main"
sprawdzarka-web = "sprawdzarka.web:main"

[tool.ruff]
line-length = 100
